# Without private.yml the list is empty and nothing is cloned
- name: Load the private list of repositories
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/private.yml"
  when: (playbook_dir ~ '/private.yml') is file

# update: false means a repository that is already there is never touched.
# Cloning a missing one needs the SSH key in the agent (run ssh-load first).
- name: Clone repositories
  ansible.builtin.git:
    repo: "{{ item.value }}"
    dest: "{{ ansible_facts.env.HOME }}/{{ item.key }}"
    update: false
  loop: "{{ repos_list | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
