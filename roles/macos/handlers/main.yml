# Handlers run once at the end, and only if a task that names them changed something.

- name: Restart Dock
  ansible.builtin.command: killall Dock
  changed_when: true

# Makes input settings take effect without logging out
- name: Apply input settings
  ansible.builtin.command: /System/Library/PrivateFrameworks/SystemAdministration.framework/Resources/activateSettings -u
  changed_when: true
