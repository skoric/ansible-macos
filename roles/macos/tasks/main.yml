# Desktop

- name: Hide widgets on the desktop
  community.general.osx_defaults:
    domain: com.apple.WindowManager
    key: StandardHideWidgets
    type: bool
    value: true

# Skipped until wallpaper/wallpaper.jpg exists
- name: Set the wallpaper
  ansible.builtin.command:
    argv:
      - osascript
      - -l
      - JavaScript
      - "{{ role_path }}/files/wallpaper.js"
      - "{{ macos_wallpaper }}"
  vars:
    macos_wallpaper: "{{ playbook_dir }}/wallpaper/wallpaper.jpg"
  when: macos_wallpaper is file
  register: macos_wallpaper_result
  changed_when: macos_wallpaper_result.stdout == "changed"

# Dock

- name: Remove all pinned apps from the Dock
  community.general.osx_defaults:
    domain: com.apple.dock
    key: persistent-apps
    type: array
    value: []
  notify: Restart Dock

- name: Hide recent apps in the Dock
  community.general.osx_defaults:
    domain: com.apple.dock
    key: show-recents
    type: bool
    value: false
  notify: Restart Dock

- name: Minimize windows with the scale effect
  community.general.osx_defaults:
    domain: com.apple.dock
    key: mineffect
    type: string
    value: scale
  notify: Restart Dock

- name: Minimize windows into their application icon
  community.general.osx_defaults:
    domain: com.apple.dock
    key: minimize-to-application
    type: bool
    value: true
  notify: Restart Dock

- name: Automatically hide and show the Dock
  community.general.osx_defaults:
    domain: com.apple.dock
    key: autohide
    type: bool
    value: true
  notify: Restart Dock

# Default apps

# What opens when a script or command-line program is double-clicked in Finder.
# The first time, macOS shows a dialog asking to confirm; the task waits for the answer.
- name: Make Ghostty the default terminal (macOS asks you to confirm)
  ansible.builtin.command:
    argv:
      - osascript
      - -l
      - JavaScript
      - "{{ role_path }}/files/default-app.js"
      - /Applications/Ghostty.app
      - type
      - public.unix-executable
  register: macos_default_terminal
  changed_when: macos_default_terminal.stdout == "changed"

# The first time, macOS shows a dialog asking to confirm; the task waits for the answer.
- name: Make Firefox the default browser (macOS asks you to confirm)
  ansible.builtin.command:
    argv:
      - osascript
      - -l
      - JavaScript
      - "{{ role_path }}/files/default-app.js"
      - /Applications/Firefox.app
      - scheme
      - "{{ item }}"
  loop:
    - http
    - https
  register: macos_default_browser
  changed_when: macos_default_browser.stdout == "changed"

# Keyboard

- name: Turn off spelling correction and typing suggestions
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: "{{ item }}"
    type: bool
    value: false
  loop:
    - NSAutomaticSpellingCorrectionEnabled   # Correct spelling automatically
    - WebAutomaticSpellingCorrectionEnabled  # the same, in web views
    - NSAllowContinuousSpellChecking         # Check spelling while typing (red underlines)
    - WebContinuousSpellCheckingEnabled      # the same, in web views
    - NSAutomaticCapitalizationEnabled       # Capitalize words automatically
    - NSAutomaticInlinePredictionEnabled     # Show inline predictive text
    - NSAutomaticTextCompletionEnabled       # Typing suggestions

# Mouse and trackpad

- name: Turn off natural scrolling
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: com.apple.swipescrolldirection
    type: bool
    value: false
  notify: Apply input settings
