# Desktop

- name: Hide widgets on the desktop
  community.general.osx_defaults:
    domain: com.apple.WindowManager
    key: StandardHideWidgets
    type: bool
    value: true

# Skipped until wallpaper/wallpaper.jpg exists
- name: Set the wallpaper
  ansible.builtin.command:
    argv:
      - osascript
      - -l
      - JavaScript
      - "{{ role_path }}/files/wallpaper.js"
      - "{{ macos_wallpaper }}"
  vars:
    macos_wallpaper: "{{ playbook_dir }}/wallpaper/wallpaper.jpg"
  when: macos_wallpaper is file
  register: macos_wallpaper_result
  changed_when: macos_wallpaper_result.stdout == "changed"

# Dock

- name: Remove all pinned apps from the Dock
  community.general.osx_defaults:
    domain: com.apple.dock
    key: persistent-apps
    type: array
    value: []
  notify: Restart Dock

- name: Hide recent apps in the Dock
  community.general.osx_defaults:
    domain: com.apple.dock
    key: show-recents
    type: bool
    value: false
  notify: Restart Dock

- name: Minimize windows with the scale effect
  community.general.osx_defaults:
    domain: com.apple.dock
    key: mineffect
    type: string
    value: scale
  notify: Restart Dock

- name: Minimize windows into their application icon
  community.general.osx_defaults:
    domain: com.apple.dock
    key: minimize-to-application
    type: bool
    value: true
  notify: Restart Dock

- name: Automatically hide and show the Dock
  community.general.osx_defaults:
    domain: com.apple.dock
    key: autohide
    type: bool
    value: true
  notify: Restart Dock

# Mouse and trackpad

- name: Turn off natural scrolling
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: com.apple.swipescrolldirection
    type: bool
    value: false
  notify: Apply input settings
