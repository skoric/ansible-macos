# Extra package sources, for packages that are not in Homebrew's main catalogue
homebrew_taps:
  - nikitabobko/tap  # aerospace

# Homebrew refuses packages from those sources until each one is trusted by name
homebrew_trusted_casks:
  - nikitabobko/tap/aerospace

homebrew_formulae:
  - ansible
  - chezmoi
  - gh
  - git
  - mise
  - neovim

homebrew_casks:
  - 1password
  - 1password-cli
  - aerospace
  - android-studio
  - claude-code
  - cmux
  - docker-desktop
  - firefox
  - font-new-york
  - font-sf-compact
  - font-sf-mono
  - font-sf-pro
  - obsidian
